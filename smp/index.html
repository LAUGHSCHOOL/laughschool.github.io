<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laugh School SMP</title>
    <meta
      name="description"
      content="A peaceful Minecraft survival server made by the creators of LAUGH SCHOOL, the Viber jokes community."
    />
    <link rel="icon" href="assets/logo-hero.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=5" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Primary">
        <a class="nav-brand" href="./">
          <img src="assets/logo-hero.png" alt="" width="40" height="40" />
          Laugh School SMP
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Open menu"
        >
          <span class="nav-toggle-bar" aria-hidden="true"></span>
          <span class="nav-toggle-bar" aria-hidden="true"></span>
          <span class="nav-toggle-bar" aria-hidden="true"></span>
        </button>
        <ul class="nav-links" id="nav-menu">
          <li><a class="is-active" href="./" aria-current="page">Home</a></li>
          <li><a href="join/">Join</a></li>
          <li><a href="about/">About</a></li>
          <li><a href="credits/">Credits</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-inner">
          <img
            class="hero-logo"
            src="assets/logo-hero.png"
            alt="Laugh School logo"
            width="280"
            height="280"
          />
          <h1 class="hero-brand">Laugh School <span>SMP</span></h1>
          <p class="hero-lead">
            A peaceful survival server made by the creators of LAUGH SCHOOL, the
            Viber jokes community.
          </p>
          <div class="btn-row">
            <a class="btn btn-primary" href="join/">Join the server</a>
            <a
              class="btn btn-discord"
              href="https://discord.gg/6cFWfEhy2"
              target="_blank"
              rel="noopener noreferrer"
              >Discord</a
            >
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <img
          class="footer-banner"
          src="assets/banner-footer.png"
          alt="Laugh School SMP — See you there!"
          width="520"
          height="120"
        />
        <p class="footer-note">
          Managed by
          <a href="https://github.com/stg-series" target="_blank" rel="noopener noreferrer"
            >STG SERIES</a
          >
        </p>
      </div>
    </footer>

    <script src="js/main.js?v=5"></script>
  </body>
</html>
